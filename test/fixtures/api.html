<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects — Fake API Site</title>
  <link rel="stylesheet" href="site.css">
  <style>
    table.projects { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
    table.projects th, table.projects td { padding: 8px 10px; border-bottom: 1px solid #ddd; text-align: left; }
    table.projects tr.row { cursor: pointer; }
    .t { font-weight: 600; } .c { color: #777; font-size: 12px; }
  </style>
  <script src="../harness.js"></script>
  <!-- like the extension: the page-world script runs before the site loads anything -->
  <script src="../../content/netwatch.js"></script>
</head>
<body>
  <div class="testbar">TEST PAGE ·
    <button onclick="psToggle()">Toggle panel (toolbar icon)</button>
    <button onclick="psReset()">Reset tracker data</button>
    <button id="next">Load page 2 (client-side)</button>
  </div>
  <header class="site-hd">Fake API Site — the table shows less than the data it loaded</header>
  <main style="padding:16px">
    <table class="projects">
      <thead><tr><th>Contract</th><th>Office</th><th>Cost</th><th>Progress</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    const peso = n => '₱' + n.toLocaleString('en-US', { minimumFractionDigits: 2 });
    async function load(page) {
      const res = await fetch(`api-page${page}.json?page=${page}&limit=25`);
      const json = await res.json();
      document.getElementById('rows').innerHTML = json.data.data
        .map(p => `<tr class="row"><td><div class="t">${p.contractId} - ${p.description}</div><div class="c">${p.category}</div></td>
          <td>${p.implementingOffice}</td><td>${peso(p.budget)}</td><td>${p.progress}%</td></tr>`)
        .join('');
    }
    document.getElementById('next').onclick = () => load(2);
    // The extension's other scripts start after the page's first data has loaded (document_idle).
    load(1).then(async () => {
      for (const f of ['ns', 'values', 'formula', 'selectors', 'extract', 'pagedata', 'filters', 'pagefilter', 'store', 'picker', 'help', 'panel', 'main']) {
        await new Promise(r => { const s = document.createElement('script'); s.src = `../../content/${f}.js`; s.onload = r; document.body.appendChild(s); });
      }
    });
  </script>
</body>
</html>
