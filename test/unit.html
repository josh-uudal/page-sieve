<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Sieve unit tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 20px; }
    .pass { color: #047857; } .fail { color: #b91c1c; font-weight: 600; }
    #fixture { position: absolute; left: -9999px; }
  </style>
  <script src="harness.js"></script>
  <script src="fixtures/data.js"></script>
  <script src="../content/ns.js"></script>
  <script src="../content/values.js"></script>
  <script src="../content/formula.js"></script>
  <script src="../content/selectors.js"></script>
  <script src="../content/extract.js"></script>
  <script src="../content/pagedata.js"></script>
  <script src="../content/filters.js"></script>
  <script src="../content/pagefilter.js"></script>
</head>
<body>
  <h1>Page Sieve unit tests</h1>
  <div id="summary"></div>
  <ol id="out"></ol>

  <div id="fixture">
    <div class="grid sc-a1B2c3 kVcKcL" id="grid"></div>
    <aside id="side"></aside>
    <ul class="results">
      <li><div class="hit"><a href="/n/1">One</a><b>4.1</b></div></li>
      <li><div class="hit"><a href="/n/2">Two</a><b>3.9</b></div></li>
      <li><div class="hit"><a href="/n/3">Three</a><b>4.8</b></div></li>
    </ul>
    <table class="ranking"><tbody>
      <tr><td>1</td><td><a href="/t/a">Alpha</a></td><td>9.1</td></tr>
      <tr><td>2</td><td><a href="/t/b">Beta</a></td><td>8.7</td></tr>
      <tr><td>3</td><td><a href="/t/c">Gamma</a></td><td>8.2</td></tr>
    </tbody></table>
  </div>

  <script>
    const PS = window.__PS;
    const results = [];
    const test = (name, fn) => {
      try {
        const r = fn();
        results.push([name, r === true || r === undefined, r === true || r === undefined ? '' : 'got ' + JSON.stringify(r)]);
      } catch (e) {
        results.push([name, false, e.message]);
      }
    };
    const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : { got: a, want: b });
    const near = (a, b, tol) => (Math.abs(a - b) <= tol ? true : { got: a, want: b });

    // ---- values ----
    const NOW = Date.parse('2026-10-13T12:00:00Z');
    const P = t => PS.values.parse(t, NOW);
    test('rating with star', () => eq(P('★ 4.6').num, 4.6));
    test('chapters', () => eq(P('Ch. 213').num, 213));
    test('thousands separator', () => eq(P('1,234 views').num, 1234));
    test('K suffix', () => eq(P('12.3K views').num, 12300));
    test('M suffix', () => eq(P('1.2M').num, 1200000));
    test('decimal comma', () => eq(P('4,5').num, 4.5));
    test('number followed by a word', () => eq(P('120 chapters').num, 120));
    test('"12 Months" is not 12M', () => eq(P('12 Months').num, 12));
    test('relative date', () => near(P('Updated 3 days ago').num, NOW - 3 * 864e5, 1));
    test('relative date: an hour ago', () => near(P('an hour ago').num, NOW - 36e5, 1));
    test('relative date: 2 hrs ago', () => near(P('2 hrs ago').num, NOW - 72e5, 1));
    test('relative date kind', () => eq(P('1 week ago').kind, 'date'));
    test('absolute date', () => eq(new Date(P('Updated: Oct 12, 2025').num).getFullYear(), 2025));
    test('ISO date', () => eq(P('2024-03-05').kind, 'date'));
    test('plain text', () => eq([P('Ongoing').num, P('Ongoing').kind], [null, 'text']));
    test('whitespace cleanup', () => eq(P('  The \n  Title ').raw, 'The Title'));
    test('empty -> null', () => eq(P('   '), null));

    // ---- class stability ----
    const U = PS.sel.isUnstableClass;
    for (const c of ['css-9x2kq1', 'sc-a1B2c3', 'kVcKcL', 'post-123', 'item_4', 'md:flex', 'w-1/2', 'Card_title__x8Yz2', 'active', 'a9f3kq2', 'on-hover', 'is-active', 'has-focus', 'highlighted'])
      test(`unstable: ${c}`, () => eq(U(c), true));
    for (const c of ['series-card', 'MangaCard', 'col-md-3', 'title', 'h2', 'card__title', 'grid'])
      test(`stable: ${c}`, () => eq(U(c), false));

    // A row that gets "on-hover" while the mouse is over it must still group with its siblings.
    test('hover class does not split a card group', () => {
      const t = document.createElement('table');
      t.innerHTML = '<tbody>' + [1, 2, 3, 4].map(i => `<tr class="project-list-row${i === 2 ? ' on-hover' : ''}"><td>Row ${i}</td><td>x</td><td>y</td></tr>`).join('') + '</tbody>';
      document.body.appendChild(t);
      const hovered = t.querySelectorAll('tr')[1];
      const found = PS.sel.findCards(PS.sel.cardSelector(hovered)).filter(c => t.contains(c));
      t.remove();
      return found.length === 4 ? true : { n: found.length };
    });

    // ---- card selector ----
    document.getElementById('grid').innerHTML = FAKE_SERIES.slice(0, 12).map(s => cardHTML(s)).join('');
    document.getElementById('side').innerHTML = FAKE_SERIES.slice(30, 35).map(s => cardHTML(s, 'mini')).join('');
    const gridCards = [...document.querySelectorAll('#grid > article')];

    test('card selector excludes the sidebar cards', () => {
      const sel = PS.sel.cardSelector(gridCards[3]);
      const found = PS.sel.findCards(sel);
      return found.length === 12 && found.every(c => gridCards.includes(c)) ? true : { sel, n: found.length };
    });
    test('card selector avoids hashed classes', () => {
      const sel = PS.sel.cardSelector(gridCards[0]);
      return /css-|sc-|kVcKcL/.test(sel) ? sel : true;
    });
    test('snap: title -> card', () => eq(PS.sel.snapToCard(gridCards[2].querySelector('.title')) === gridCards[2], true));
    test('snap: genre tag -> card (not the tag)', () => eq(PS.sel.snapToCard(gridCards[2].querySelector('.genres a')) === gridCards[2], true));
    test('snap: rating -> card', () => eq(PS.sel.snapToCard(gridCards[4].querySelector('.rating')) === gridCards[4], true));
    test('similar() finds the 12 grid cards', () => eq(PS.sel.similar(gridCards[0]).length, 12));

    const lis = [...document.querySelectorAll('.results li')];
    test('wrapped card (div in li) selects all 3', () => {
      const sel = PS.sel.cardSelector(lis[1].querySelector('.hit'));
      return eq(PS.sel.findCards(sel).length, 3);
    });
    const trs = [...document.querySelectorAll('.ranking tr')];
    test('snap: table cell -> row', () => eq(PS.sel.snapToCard(trs[1].querySelector('a')) === trs[1], true));
    test('table row selector', () => eq(PS.sel.findCards(PS.sel.cardSelector(trs[0])).length, 3));

    // ---- field selectors + extraction ----
    const card = gridCards[0];
    const fsel = el => PS.sel.fieldSelector(card, el, gridCards);
    test('title field uses its class', () => eq(fsel(card.querySelector('.title')), 'a.title'));
    test('rating field uses its class', () => eq(fsel(card.querySelector('.rating')), 'span.rating'));
    // Card 5 has no rating, so its chapter span is the 1st span, not the 2nd.
    test('unclassed chapter span is right in every card, incl. the one without a rating', () => {
      const s = fsel(card.querySelectorAll('.stats span')[1]);
      return gridCards.every(c => /^Ch\./.test(PS.sel.resolve(c, s).textContent)) || s;
    });
    test('unclassed views span is right in every card', () => {
      const s = fsel(card.querySelectorAll('.stats span')[2]);
      return gridCards.every(c => / views$/.test(PS.sel.resolve(c, s).textContent)) || s;
    });
    const recipe = {
      card: PS.sel.cardSelector(card),
      fields: [
        { name: 'Title', sel: 'a.title', attr: 'text' },
        { name: 'Rating', sel: 'span.rating', attr: 'text' },
        { name: 'Cover', sel: fsel(card.querySelector('img')), attr: 'src' },
      ],
    };
    test('item key is the title link', () => eq(PS.extract.item(card, recipe).key, new URL('series.html?id=100', location.href).href));
    test('missing rating -> null value', () => eq(PS.extract.item(gridCards[5], recipe).values.Rating, null));
    // Items keep the element's text as captured; parsing happens when shown, so field settings apply retroactively.
    test('text field stores the captured text', () => eq(PS.extract.item(card, recipe).values.Rating, { text: '★ 3.98' }));
    test('image field stores its URL', () => eq(/^data:image\/svg/.test(PS.extract.item(card, recipe).values.Cover.src), true));
    test('item keys are unique across cards', () => eq(new Set(gridCards.map(c => PS.extract.item(c, recipe).key)).size, 12));

    // ---- names ----
    test('guess: rating', () => eq(PS.extract.guessName(card.querySelector('.rating'), 1), 'Rating'));
    test('guess: title', () => eq(PS.extract.guessName(card.querySelector('.title'), 0), 'Title'));
    test('guess: chapters by value', () => eq(PS.extract.guessName(card.querySelectorAll('.stats span')[1], 2), 'Chapters'));
    test('guess: views by value', () => eq(PS.extract.guessName(card.querySelectorAll('.stats span')[2], 2), 'Views'));
    test('guess: cover', () => eq(PS.extract.guessName(card.querySelector('img'), 3), 'Cover'));

    // ---- url patterns ----
    const sug = PS.sel.suggestPattern;
    const cp = (p, path) => PS.sel.compilePattern(p).test(path);
    test('suggest: paged path', () => eq(sug('/search/page/2'), '/search/**'));
    test('suggest: plain path', () => eq(sug('/series-finder/'), '/series-finder/**'));
    test('suggest: root', () => eq(sug('/'), '/**'));
    test('suggest: id path', () => eq(sug('/manga/12345-solo'), '/manga/**'));
    test('match: /search/** covers /search', () => eq(cp('/search/**', '/search'), true));
    test('match: /search/** covers /search/page/3', () => eq(cp('/search/**', '/search/page/3'), true));
    test('match: /search/** excludes /searchx', () => eq(cp('/search/**', '/searchx'), false));
    test('match: /** = whole site', () => eq(cp('/**', '/anything/here'), true));
    test('match: single star', () => eq([cp('/list/*/top', '/list/2024/top'), cp('/list/*/top', '/list/a/b/top')], [true, false]));

    // ---- per-field settings: type + extract regex ----
    const PA = (text, field) => PS.values.parseAs(text, field, NOW);
    test('parseAs auto behaves like parse', () => eq(PA('Ch. 213', { type: 'auto' }).num, 213));
    test('parseAs with no settings', () => eq(PA('★ 4.6', {}).num, 4.6));
    test('extract regex uses the first capture group', () => eq([PA('Vol. 3 Ch. 45', { regex: 'Ch\\.\\s*(\\d+)' }).num, PA('Vol. 3 Ch. 45', { regex: 'Ch\\.\\s*(\\d+)' }).raw], [45, '45']));
    test('extract regex without a group uses the whole match', () => eq(PA('Rank #12 of 300', { regex: '#\\d+' }).raw, '#12'));
    test('extract regex is case-insensitive', () => eq(PA('CH. 9', { regex: 'ch\\.\\s*(\\d+)' }).num, 9));
    test('extract regex with no match -> null', () => eq(PA('Completed', { regex: 'Ch\\.\\s*(\\d+)' }), null));
    test('invalid extract regex is ignored', () => eq(PA('Ch. 5', { regex: '(' }).num, 5));
    test('type number shows the clean number', () => eq(PA('Ch. 213', { type: 'number' }).display, '213'));
    test('type number groups thousands', () => eq(PA('1.2M views', { type: 'number' }).display, '1,200,000'));
    test('type number keeps decimals', () => eq(PA('★ 3.98', { type: 'number' }).display, '3.98'));
    test('type number on text without digits -> no number', () => eq(PA('Ongoing', { type: 'number' }).num, null));
    test('type text never sorts as a number', () => eq(PA('Ch. 213', { type: 'text' }).num, null));
    test('type date', () => eq(PA('Updated 3 days ago', { type: 'date' }).kind, 'date'));
    test('auto keeps the original text as display', () => eq(PA('Ch. 213', {}).display, 'Ch. 213'));
    test('parseAs empty -> null', () => eq(PA('  ', {}), null));

    // ---- column filters ----
    const V = t => PS.values.parse(t, NOW);
    const F = (expr, kind, text) => PS.filters.compile(expr, kind, NOW).test(text == null ? null : V(text));
    test('number >', () => eq([F('>4.5', 'number', '★ 4.6'), F('>4.5', 'number', '★ 4.4')], [true, false]));
    test('number >= with suffix', () => eq([F('>=1M', 'number', '1.2M views'), F('>=1M', 'number', '950K views')], [true, false]));
    test('number <=', () => eq([F('<=100', 'number', 'Ch. 100'), F('<=100', 'number', 'Ch. 101')], [true, false]));
    test('number range is inclusive', () => eq([F('10..50', 'number', 'Ch. 10'), F('10..50', 'number', 'Ch. 50'), F('10..50', 'number', 'Ch. 51')], [true, true, false]));
    test('open-ended ranges', () => eq([F('10..', 'number', 'Ch. 10'), F('10..', 'number', 'Ch. 9'), F('..50', 'number', 'Ch. 50'), F('..50', 'number', 'Ch. 51')], [true, false, true, false]));
    test('a lone operator while typing filters nothing', () => eq(F('>', 'number', 'Ch. 9'), true));
    test('number equals', () => eq([F('213', 'number', 'Ch. 213'), F('213', 'number', 'Ch. 21')], [true, false]));
    test('number !=', () => eq([F('!=0', 'number', '0 views'), F('!=0', 'number', '5 views')], [false, true]));
    test('number filter excludes blanks', () => eq(F('>1', 'number', null), false));
    test('AND of two conditions', () => eq([F('>3 <5', 'number', '★ 4.6'), F('>3 <5', 'number', '★ 5.5')], [true, false]));
    test('date: newer than 7 days', () => eq([F('<7d', 'date', '3 days ago'), F('<7d', 'date', '2 weeks ago')], [true, false]));
    test('date: older than a month', () => eq([F('>1m', 'date', '3 months ago'), F('>1m', 'date', '1 week ago')], [true, false]));
    test('date: hours', () => eq(F('<12h', 'date', '5 hours ago'), true));
    test('date: after a calendar date', () => eq([F('>2025-01-01', 'date', 'Oct 12, 2025'), F('>2025-01-01', 'date', 'Oct 12, 2024')], [true, false]));
    test('date: between calendar dates', () => eq(F('2025-01-01..2025-12-31', 'date', 'Oct 12, 2025'), true));
    test('text contains (case-insensitive)', () => eq([F('drag', 'text', 'The Dragon Chef'), F('drag', 'text', 'The Iron Tower')], [true, false]));
    test('text !word excludes', () => eq([F('!hiatus', 'text', 'Hiatus'), F('!hiatus', 'text', 'Ongoing')], [false, true]));
    test('text exact match', () => eq([F('="ongoing"', 'text', 'Ongoing'), F('=ongo', 'text', 'Ongoing')], [true, false]));
    test('text quoted phrase', () => eq([F('"dragon chef"', 'text', 'The Dragon Chef'), F('"dragon chef"', 'text', 'Chef of the Dragon')], [true, false]));
    test('text two words = AND', () => eq([F('iron tower', 'text', 'The Iron Tower'), F('iron tower', 'text', 'The Iron Garden')], [true, false]));
    test('OR with |', () => eq([F('Ongoing | Hiatus', 'text', 'Hiatus'), F('Ongoing | Hiatus', 'text', 'Completed')], [true, false]));
    test('regex', () => eq([F('/^the \\w+ dragon/i', 'text', 'The Paper Dragon Chef'), F('/^the \\w+ dragon/i', 'text', 'Dragon Tales')], [true, false]));
    test('regex is case-sensitive without i', () => eq(F('/dragon/', 'text', 'The Dragon Chef'), false));
    test('negated regex', () => eq([F('!/isekai|fantasy/i', 'text', 'Fantasy'), F('!/isekai|fantasy/i', 'text', 'Drama')], [false, true]));
    test('regex with spaces and | stays one term', () => eq(F('/iron tower|paper lantern/i', 'text', 'The Paper Lantern'), true));
    test('regex on a number column matches the text', () => eq(F('/^Ch\\. 2\\d\\d$/', 'number', 'Ch. 213'), true));
    test('invalid regex reports an error and hides nothing', () => {
      const f = PS.filters.compile('/(/', 'text', NOW);
      return eq([!!f.error, f.test(V('anything'))], [true, true]);
    });
    test('empty / !empty', () => eq([F('empty', 'text', null), F('empty', 'text', 'x'), F('!empty', 'text', null), F('!empty', 'text', 'x')], [true, false, false, true]));
    test('blank filter = no filter', () => eq(PS.filters.compile('   ', 'text', NOW), null));
    test('plain number on a text column is a substring', () => eq(F('2', 'text', 'Season 2'), true));
    // The top search box: each term must match within some single column (so ^ and $ mean the cell's start/end).
    const A = (expr, texts) => PS.filters.compile(expr, 'text', NOW).testAny(texts.map(V));
    test('search: regex $ anchors to a cell', () => eq(A('/dragon chef$/i', ['The Silent Dragon Chef', 'Ongoing']), true));
    test('search: words may match different columns', () => eq(A('dragon ongoing', ['The Dragon Chef', 'Ongoing']), true));
    test('search: !word excludes if any column has it', () => eq(A('!dragon', ['The Dragon Chef', 'Ongoing']), false));
    test('search: !word keeps rows without it', () => eq(A('!dragon', ['The Iron Tower', 'Ongoing']), true));
    test('search: OR', () => eq([A('Hiatus | Completed', ['X', 'Hiatus']), A('Hiatus | Completed', ['X', 'Ongoing'])], [true, false]));
    test('search: numbers compare per column', () => eq(A('>4.5', ['The X', '★ 4.6']), true));
    // ---- one matcher for the list and the page ----
    const RM = (cols, search, kinds) => PS.filters.rowMatcher(cols, search, kinds, NOW);
    const kindsRT = { Title: 'text', Rating: 'number', Cover: 'image' };
    test('rowMatcher: column filter', () => {
      const m = RM({ Rating: '>4' }, '', kindsRT);
      return eq([m.test({ Title: V('A'), Rating: V('★ 4.5') }), m.test({ Title: V('B'), Rating: V('★ 3') })], [true, false]);
    });
    test('rowMatcher: search + column filter', () => {
      const m = RM({ Rating: '>4' }, 'dragon', kindsRT);
      return eq([m.test({ Title: V('The Dragon'), Rating: V('★ 4.5') }), m.test({ Title: V('The Tower'), Rating: V('★ 4.5') })], [true, false]);
    });
    test('rowMatcher: active only when a filter is set', () => eq([RM({}, '', kindsRT).active, RM({ Rating: ' ' }, '', kindsRT).active, RM({}, 'x', kindsRT).active], [false, false, true]));
    test('rowMatcher: bad regex is reported and ignored', () => {
      const m = RM({ Title: '/(/' }, '', kindsRT);
      return eq([!!m.errors.Title, m.test({ Title: V('x') }), m.active], [true, true, false]);
    });
    test('rowMatcher: image columns are not filtered', () => eq(RM({ Cover: 'zzz' }, '', kindsRT).active, false));
    test('shownItem(): parses a whole item with field settings', () => {
      const r2 = { fields: [{ name: 'Rating', sel: 'span.rating', attr: 'text', type: 'number' }] };
      return eq(PS.extract.shownItem(PS.extract.item(card, r2), r2, NOW).Rating.display, '3.98');
    });

    // ---- hiding / dimming cards on the page ----
    test('pageFilter: hide marks failing cards and hides them', () => {
      const res = PS.pageFilter.apply(gridCards, c => gridCards.indexOf(c) % 2 === 0, 'hide');
      const hiddenNow = gridCards.filter(c => getComputedStyle(c).display === 'none').length;
      return eq([res, hiddenNow, gridCards[1].getAttribute('data-ps-filter')], [{ hidden: 6, total: 12 }, 6, 'hide']);
    });
    test('pageFilter: re-applying un-hides cards that match now', () => {
      PS.pageFilter.apply(gridCards, () => true, 'hide');
      return eq(gridCards.filter(c => c.hasAttribute('data-ps-filter')).length, 0);
    });
    test('pageFilter: dim fades instead of hiding', () => {
      PS.pageFilter.apply(gridCards, c => c !== gridCards[0], 'dim');
      const s = getComputedStyle(gridCards[0]);
      return eq([s.display !== 'none', +s.opacity < 0.5], [true, true]);
    });
    test('pageFilter: hidden cards read the same as visible ones', () => {
      const c = gridCards[2];
      const extra = document.createElement('div');
      extra.className = 'blocks';
      extra.innerHTML = '<div>Ch. 5</div><div>3 days ago</div><span style="display:none">note 99</span>';
      c.appendChild(extra);
      const read = () => PS.values.clean(PS.extract.textOf(extra));
      const shown = read();
      PS.pageFilter.apply(gridCards, card => card !== c, 'hide');
      const inside = PS.pageFilter.read(read);
      const stillHidden = getComputedStyle(c).display === 'none';
      PS.pageFilter.clear();
      extra.remove();
      return eq([shown, inside, stillHidden], ['Ch. 5 3 days ago', 'Ch. 5 3 days ago', true]);
    });
    test('pageFilter: a card is read while hidden when deciding to keep it', () => {
      const c = gridCards[3];
      const extra = document.createElement('div');
      extra.innerHTML = '<div>Ch. 5</div><div>3 days ago</div>';
      c.appendChild(extra);
      const keep = card => card !== c || PS.values.clean(PS.extract.textOf(extra)) === 'Ch. 5 3 days ago';
      PS.pageFilter.apply(gridCards, card => card !== c, 'hide');
      const res = PS.pageFilter.apply(gridCards, keep, 'hide');
      PS.pageFilter.clear();
      extra.remove();
      return eq(res.hidden, 0);
    });
    test('pageFilter: clear restores every card', () => {
      PS.pageFilter.apply(gridCards, () => false, 'hide');
      PS.pageFilter.clear();
      return eq(document.querySelectorAll('[data-ps-filter]').length + gridCards.filter(c => getComputedStyle(c).display === 'none').length, 0);
    });

    test('shown(): old-format items still display', () => eq(PS.extract.shown({ raw: 'Ch. 7', num: 7, kind: 'number' }, {}, NOW).num, 7));
    test('shown(): field settings apply to stored text', () => eq(PS.extract.shown({ text: 'Vol. 3 Ch. 45' }, { regex: 'ch\\.\\s*(\\d+)', type: 'number' }, NOW).display, '45'));
    test('shown(): images', () => eq(PS.extract.shown({ src: 'http://x/a.png' }, { attr: 'src' }, NOW).kind, 'image'));
    test('column kind: number', () => eq(PS.filters.columnKind(['★ 4.1', '★ 3.9', 'N/A'].map(V).concat([V('★ 5')])), 'number'));
    test('column kind: date', () => eq(PS.filters.columnKind(['3 days ago', '1 week ago'].map(V)), 'date'));
    test('column kind: text', () => eq(PS.filters.columnKind(['Ongoing', 'Completed', 'Season 2'].map(V)), 'text'));

    // ---- derived columns ----
    const FV = (src, vals) => {
      const v = PS.formula.value(src, vals, NOW);
      return v && v.num;
    };
    const row = { Views: V('1.2M views'), Chapters: V('Ch. 200'), Rating: V('★ 4.5'), Status: V('Ongoing'),
      Updated: V('3 days ago'), Started: V('2026-10-01'), Zero: V('0 follows') };
    test('formula: division', () => eq(FV('{Views} / {Chapters}', row), 6000));
    test('formula: precedence and parentheses', () => eq([FV('1 + 2 * 3', row), FV('(1 + 2) * 3', row)], [7, 9]));
    test('formula: unary minus', () => eq(FV('-{Rating} + 5', row), 0.5));
    test('formula: column names are not case-sensitive', () => eq(FV('{views} / { chapters }', row), 6000));
    test('formula: text column -> blank', () => eq(FV('{Status} * 2', row), null));
    test('formula: blank column -> blank', () => eq(FV('{Missing} + 1', row), null));
    test('formula: divide by zero -> blank', () => eq(FV('{Views} / {Zero}', row), null));
    test('formula: dates count in days', () => eq(FV('today - {Updated}', row), 3));
    test('formula: date minus date', () => near(FV('{Updated} - {Started}', row), 9.5, 0.01));
    test('formula: display rounds, small ratios keep 3 digits', () =>
      eq([PS.formula.value('10 / 3', {}, NOW).display, PS.formula.value('1 / 3000', {}, NOW).display, PS.formula.value('{Views}', row, NOW).display], ['3.33', '0.000333', '1,200,000']));
    test('formula: derived values are numbers', () => eq(PS.formula.value('{Rating} * 2', row, NOW).kind, 'number'));
    const FE = (src, names) => PS.formula.compile(src, names).error;
    test('formula: valid', () => eq(FE('{Views} / {Chapters}', ['Views', 'Chapters']), null));
    test('formula: unknown column is an error in the editor', () => eq(!!FE('{Likes} / 2', ['Views']), true));
    test('formula: bare word is an error', () => eq(/\{Views\}/.test(FE('Views / 2', ['Views'])), true));
    for (const bad of ['{Views} /', '({Views}', '{Views} 2', '', '{Views', '2 % 3'])
      test(`formula: syntax error "${bad}"`, () => eq(!!FE(bad, ['Views']), true));
    test('shownItem(): derived columns use picked and earlier derived columns', () => {
      const r3 = { fields: [
        { name: 'Per', formula: '{Views} / {Chapters}' },
        { name: 'Views', sel: 'x', attr: 'text', type: 'number' },
        { name: 'Chapters', sel: 'y', attr: 'text' },
        { name: 'Twice', formula: '{Per} * 2' },
      ] };
      const vals = PS.extract.shownItem({ values: { Views: { text: '1,000 views' }, Chapters: { text: 'Ch. 10' } } }, r3, NOW, NOW);
      return eq([vals.Per.num, vals.Twice.num], [100, 200]);
    });
    test('derived columns can be filtered like numbers', () => {
      const m = RM({ Per: '>50' }, '', { Per: 'number' });
      return eq([m.test({ Per: PS.formula.value('600 / 6', {}, NOW) }), m.test({ Per: PS.formula.value('6 / 6', {}, NOW) })], [true, false]);
    });
    test('item(): the key field identifies the item wherever it sits', () => {
      const c = document.createElement('div');
      c.innerHTML = '<a class="t" href="/series/1">Title</a> <a class="au" href="/author/9">Author</a>';
      document.getElementById('side').appendChild(c);
      const title = { name: 'Title', sel: 'a.t', attr: 'text', key: true };
      const author = { name: 'Author', sel: 'a.au', attr: 'text' };
      const keys = [PS.extract.item(c, { fields: [author, title] }).key, PS.extract.item(c, { fields: [author, { ...title, key: false }] }).key];
      c.remove();
      return eq(keys.map(k => new URL(k).pathname), ['/series/1', '/author/9']);
    });
    test('item(): derived columns are not captured from the card', () => {
      const r4 = { fields: [{ name: 'Rating', sel: 'span.rating', attr: 'text' }, { name: 'R2', formula: '{Rating} * 2' }] };
      return eq(Object.keys(PS.extract.item(card, r4).values), ['Rating']);
    });

    // ---- page data ----
    test('data: flatten nests paths, joins plain lists, skips blanks', () =>
      eq(PS.data.flatten({ id: 7, loc: { region: 'X', geo: { lat: 1 } }, tags: ['a', 'b'], objs: [{ a: 1 }], none: null, empty: '' }),
        { id: '7', 'loc.region': 'X', 'loc.geo.lat': '1', tags: 'a, b' }));
    test('data: labels', () => eq([PS.data.label('sourceOfFunds'), PS.data.label('location.region'), PS.data.label('start_date')],
      ['Source of funds', 'Location region', 'Start date']));
    const dcards = ['24DK0055', '24K00292', '24GA0187'].map((id, i) => {
      const el = document.createElement('div');
      el.innerHTML = `<div>${id} - PROJECT ${i}</div><div>Roads</div>`;
      document.getElementById('side').appendChild(el);
      return el;
    });
    const linked = document.createElement('div');
    linked.innerHTML = '<a href="/manga/98765/some-title">Some title</a>';
    document.getElementById('side').appendChild(linked);
    PS.data.add([[
      { contractId: '24DK0055', category: 'Roads', sourceOfFunds: 'GAA 2024', budget: 146995031.16 },
      { contractId: '24K00292', category: 'Roads', sourceOfFunds: 'GAA 2025', budget: 93970437.46 },
      { contractId: '24GA0187', category: 'Roads', sourceOfFunds: 'Special', budget: 1963918.78 },
      { contractId: '99ZZ0001', category: 'Bridges', sourceOfFunds: 'Other', budget: 5 },
    ]]);
    PS.data.add([[{ id: 98765, slug: 'some-title', rating: 4.5 }, { id: 11111, slug: 'other', rating: 3 }]]);
    test('data: the same records again are not added twice', () => {
      const before = PS.data.count();
      PS.data.add([[{ contractId: '24DK0055', category: 'Roads', sourceOfFunds: 'GAA 2024', budget: 146995031.16 }]]);
      return eq(PS.data.count(), before);
    });
    test('data: join found by an id in the card text (not a shared value like the category)', () =>
      eq(PS.data.detectJoin(dcards), { path: 'contractId', matched: 3, total: 3 }));
    test('data: recordFor finds the card\'s record', () => eq(PS.data.recordFor(dcards[1], 'contractId').sourceOfFunds, 'GAA 2025'));
    test('data: an id in a link counts too', () => eq(PS.data.recordFor(linked, 'id').rating, '4.5'));
    test('data: no record -> null', () => {
      const el = document.createElement('div');
      el.textContent = 'nothing here';
      return eq(PS.data.recordFor(el, 'contractId'), null);
    });
    test('capture(): page data fields come from the record; left out when there is none', () => {
      const fields = [{ name: 'Funds', data: 'sourceOfFunds' }, { name: 'Cost', data: 'budget', type: 'number' }];
      const el = document.createElement('div');
      el.textContent = 'unknown';
      return eq([PS.extract.capture(dcards[0], fields, 'contractId'), PS.extract.capture(el, fields, 'contractId')],
        [{ Funds: { text: 'GAA 2024' }, Cost: { text: '146995031.16' } }, {}]);
    });
    test('item(): page data fields never become the item key', () => {
      const it = PS.extract.item(dcards[0], { join: 'contractId', fields: [{ name: 'Funds', data: 'sourceOfFunds' }, { name: 'T', sel: 'div', attr: 'text' }] });
      return eq(it.key, '24DK0055 - PROJECT 0');
    });
    dcards.forEach(c => c.remove());
    linked.remove();

    // ---- report ----
    const out = document.getElementById('out');
    let fails = 0;
    for (const [name, ok, msg] of results) {
      if (!ok) fails++;
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = (ok ? '✓ ' : '✗ ') + name + (msg ? ' — ' + msg : '');
      out.appendChild(li);
    }
    document.getElementById('summary').innerHTML =
      `<b class="${fails ? 'fail' : 'pass'}">${results.length - fails}/${results.length} passed</b>`;
    window.TEST_RESULT = { total: results.length, fails, failed: results.filter(r => !r[1]) };
  </script>
</body>
